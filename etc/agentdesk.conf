# agentdesk 配置（bash 语法，被 bin/agentdesk source）
# 独立无头 X 桌面：屏幕/输入与真实桌面隔离，默认纯软件渲染，不碰 DRM/GPU。
AD_DISPLAY="${AD_DISPLAY:-:99}"
AD_GEOMETRY="${AD_GEOMETRY:-1920x1080x24}"
AD_DPI="${AD_DPI:-96}"
AD_VNC_PORT="${AD_VNC_PORT:-5900}"
AD_WEB_PORT="${AD_WEB_PORT:-6080}"
# 旁观通道默认只绑 127.0.0.1（本机浏览器）。要局域网看，改成 0.0.0.0 并自担风险。
AD_BIND="${AD_BIND:-127.0.0.1}"
AD_ROOT="${AD_ROOT:-$HOME/.local/agentdesk/root}"
AD_VAR="${AD_VAR:-$HOME/.local/agentdesk/var}"
AD_NOVNC="${AD_NOVNC:-$AD_ROOT/share/novnc}"

# 空闲冻结：无操作超过 N 秒把整块桌面 SIGSTOP（保留现场、CPU 归零），任何 agentdesk 动作自动解冻
AD_IDLE_FREEZE_SEC="${AD_IDLE_FREEZE_SEC:-3600}"
# timer 检查间隔（秒）
AD_IDLE_CHECK_SEC="${AD_IDLE_CHECK_SEC:-300}"

# GPU 渲染：off=软件渲染(llvmpipe) / zink=GL 走 Vulkan(iGPU) / auto=有 Vulkan ICD 就用 zink
AD_GPU="${AD_GPU:-off}"
# 指定 Vulkan ICD 文件（如 nouveau_icd.x86_64.json 走 NVIDIA）；空=默认设备(Intel iGPU)
AD_GPU_ICD="${AD_GPU_ICD:-}"
# Vulkan ICD 目录（AD_GPU=auto 时探测用；非标准安装可改）
AD_VK_ICD_DIR="${AD_VK_ICD_DIR:-/usr/share/vulkan/icd.d}"
